name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

env:
  TRANSIEVER_LIVE_TESTS: "false"
  TRANSIEVER_LIVE_WRITES: "false"

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Transiever.SieveRuler.slnx

      - name: Build
        run: dotnet build Transiever.SieveRuler.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Transiever.SieveRuler.slnx --configuration Release --no-build

  native-aot:
    name: Native AOT smoke (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            executable: srtx.exe
          - os: windows-latest
            rid: win-x86
            executable: srtx.exe
          - os: ubuntu-latest
            rid: linux-x64
            executable: srtx
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Linux Native AOT prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev
      - name: Restore Native AOT dependencies
        run: >-
          dotnet restore src/Transiever.SieveRuler.Cli/Transiever.SieveRuler.Cli.csproj
          --runtime ${{ matrix.rid }} --no-http-cache
          -p:SelfContained=true -p:PublishAot=true -p:PublishTrimmed=true -p:PublishSingleFile=true
          -p:InvariantGlobalization=false -p:TreatWarningsAsErrors=true
          -p:ManageSieveProject=__missing_managesieve__.csproj
      - name: Publish Native AOT executable
        run: >-
          dotnet publish src/Transiever.SieveRuler.Cli/Transiever.SieveRuler.Cli.csproj
          --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore
          -p:PublishAot=true -p:PublishTrimmed=true -p:PublishSingleFile=true
          -p:InvariantGlobalization=false -p:TreatWarningsAsErrors=true
          -p:ManageSieveProject=__missing_managesieve__.csproj
          --output artifacts/publish/${{ matrix.rid }}
      - name: Verify executable architecture and smoke test help
        run: |
          executable="./artifacts/publish/${{ matrix.rid }}/${{ matrix.executable }}"
          format="$(file -b "$executable")"
          echo "Executable format for ${{ matrix.rid }}: $format"
          case "${{ matrix.rid }}" in
            win-x64) [[ "$format" == PE32+\ executable* && "$format" == *x86-64* ]] ;;
            win-x86) [[ "$format" == PE32\ executable* && ( "$format" == *80386* || "$format" == *i386* ) ]] ;;
            linux-x64) [[ "$format" == ELF\ 64-bit* && "$format" == *x86-64* ]] ;;
          esac
          "$executable" --help
      - name: Smoke test Linux JSON commands
        if: matrix.os == 'ubuntu-latest'
        run: |
          smoke_directory="$(mktemp -d)"
          rules="$smoke_directory/rules.json"
          printf '%s\n' '{"$schema":"urn:sieveruler:rules:v1","schemaVersion":1,"sourceId":"smoke","rules":[],"diagnostics":[]}' > "$rules"
          executable="./artifacts/publish/${{ matrix.rid }}/srtx"
          "$executable" inspect --rules "$rules"
          "$executable" optimize conservative --rules "$rules" --output "$smoke_directory/optimized.json"
          "$executable" generate --rules "$rules" --sieve "$smoke_directory/rules.sieve"
